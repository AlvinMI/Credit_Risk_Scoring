apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-risk-api-deployment
  labels:
    app: credit-risk-api
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: credit-risk-api
  template:
    metadata:
      labels:
        app: credit-risk-api
    spec:
      containers:
      - name: credit-risk-api-container
        image: credit-risk-api:v1
        imagePullPolicy: Never 
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"