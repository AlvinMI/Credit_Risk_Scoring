services:

  fastapi_app:
    build: .
    container_name: fastapi_credit_container
    ports:
      - 8000:8000

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_container
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    depends_on:
      - fastapi_app
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_container
    ports:
      - '3000:3000'
    depends_on:
    - prometheus